[build-system]
requires = ["setuptools>=65", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "history-advanced-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=1.7.3,<1.8",
  "langchain-google-genai==4.5.0",
  "langchain-pinecone==0.2.13",
  "openai>=3.42.1,<4",
  "pinecone>=7.3,<8",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2.4,<2",
  "streamlit>=1.66.1,<2",
  "tiktoken>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pyright[nodejs]>=1.1.414,<1.2",
  "ruff>=0.17.5,<0.18",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "scripts", "tests", "app.py"]
extraPaths = ["src"]
venvPath = ".."
venv = ".venv"
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

